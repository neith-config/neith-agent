name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...

  coverage:
    name: Coverage (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: go test with coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
          total=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | sed 's/%//')
          if [ "$total" != "100.0" ]; then
            echo "coverage must be 100.0%, got ${total}%" >&2
            exit 1
          fi

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-13
            goos: darwin
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: go test
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          out="dist/neth-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then out="${out}.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "${out}" ./cmd/neth-agent
      - uses: actions/upload-artifact@v4
        with:
          name: neth-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  mutesting:
    name: Mutation Score (100%)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: install go-mutesting
        run: go install -v github.com/avito-tech/go-mutesting/...@48d0401f00fbfb9502adc2c5138497ad8ccfafb9
      - name: go-mutesting
        run: |
          out=$(go-mutesting ./...)
          echo "$out"
          score=$(echo "$out" | awk '/^The mutation score is /{print $5; exit}')
          if [ "$score" != "1.000000" ]; then
            echo "mutation score must be 1.000000, got $score" >&2
            exit 1
          fi
